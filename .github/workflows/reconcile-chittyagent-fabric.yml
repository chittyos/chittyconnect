name: Reconcile ChittyAgent Fabric

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-chittyagent-fabric.yml"

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fabric-reconcile]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ChittyConnect
        uses: actions/checkout@v4

      - name: Fetch GitHub App identity from ChittyConnect
        id: chitty
        uses: ./.github/actions/chittyconnect-credentials
        with:
          credentials: GITHUB_APP_ID,GITHUB_APP_PRIVATE_KEY

      - name: Mint short-lived chittyentity installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ steps.chitty.outputs.GITHUB_APP_ID }}
          private-key: ${{ steps.chitty.outputs.GITHUB_APP_PRIVATE_KEY }}
          owner: chittyos
          repositories: chittyentity

      - name: Checkout canonical ChittyAgent source
        uses: actions/checkout@v4
        with:
          repository: chittyos/chittyentity
          ref: main
          path: chittyentity
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconcile existing Anthropic Managed Agent projections
        env:
          CHITTYCONNECT_API_KEY: ${{ secrets.CHITTYCONNECT_API_KEY }}
          CHITTYENTITY_DIR: chittyentity
        run: bash scripts/reconcile-anthropic-fabric.sh

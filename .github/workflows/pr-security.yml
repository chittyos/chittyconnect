name: PR Security Checks

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ###########################################################################
  # Security Scanning
  ###########################################################################
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential secrets..."

          # Patterns that should NOT be in code
          PATTERNS=(
            'op://[^"'"'"'[:space:]]+'  # chittysecrets refs (ok in workflows, not in src)
            'AKIA[0-9A-Z]{16}'          # AWS Access Key
            'sk-[a-zA-Z0-9]{48}'        # OpenAI API Key
            'ghp_[a-zA-Z0-9]{36}'       # GitHub PAT
            'gho_[a-zA-Z0-9]{36}'       # GitHub OAuth
            'github_pat_[a-zA-Z0-9_]+'  # GitHub Fine-grained PAT
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" src/ --include="*.js" --include="*.ts" 2>/dev/null; then
              echo "⚠️ Potential secret pattern found: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "❌ Potential secrets detected in source code!"
            echo "Please use chittysecrets secret references or environment variables instead."
            exit 1
          fi

          echo "✅ No secrets detected in source code."

      - name: Check dependencies for vulnerabilities
        run: |
          set -euo pipefail
          # This must FAIL, not warn. governance-checks.yml names "Security Scan"
          # as a reviewer that gates critical changes; a reviewer that cannot say
          # no is not a reviewer. Both workspaces are audited — dependabot counts
          # alerts per manifest and ui/ has its own lockfile.
          fail=0
          for dir in . ui; do
            [ -f "$dir/package-lock.json" ] || continue
            echo "::group::npm audit ($dir)"
            ( cd "$dir" && npm audit --audit-level=high ) || fail=1
            echo "::endgroup::"
          done
          [ "$fail" -eq 0 ] || {
            echo "::error::High or critical severity dependency vulnerabilities present."
            exit 1
          }

  ###########################################################################
  # Adversarial Diff Review (merged from adversarial-review.yml)
  ###########################################################################
  adversarial-review:
    name: Adversarial Diff Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check for high-risk patterns in diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Findings here FAIL the job. This check is named as a required reviewer
          # by governance-checks.yml, and a reviewer that only warns cannot gate
          # anything. Lockfiles are excluded from the heuristics: they are machine
          # generated and produce false positives on integrity/resolved fields.
          diff_output=$(git diff "$PR_BASE_SHA" "$PR_HEAD_SHA" -- . \
            ':(exclude)*package-lock.json' ':(exclude)*pnpm-lock.yaml' \
            ':(exclude)*yarn.lock' || true)

          findings=0

          # Check for hardcoded secrets patterns
          if echo "$diff_output" | grep -iE '(password|secret|token|api_key)\s*[:=]\s*["'"'"'][^"'"'"']{8,}' | grep -v test | grep -v mock; then
            echo "::error::Potential hardcoded secret detected in diff"
            findings=1
          fi

          # Check for eval/exec patterns
          if echo "$diff_output" | grep -E '^\+.*\b(eval|exec|Function)\s*\(' | grep -v test; then
            echo "::error::Dynamic code execution pattern detected"
            findings=1
          fi

          [ "$findings" -eq 0 ] || {
            echo "A finding here blocks the PR. If it is a false positive, narrow the"
            echo "pattern in this workflow deliberately rather than downgrading it to a warning."
            exit 1
          }

          echo "Adversarial review complete - no findings"

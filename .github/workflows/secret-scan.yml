# Runs gitleaks. Until this existed, .gitleaks.toml was referenced in exactly
# one place — a file-EXISTENCE check in governance-gates.yml — so the config
# had never scanned anything. A required-artifact check proves a file is
# present, not that it does anything.
#
# Scope is the PR's own commits, deliberately. A full-history scan of this repo
# currently reports 27 findings (mostly `curl -H "Authorization: Bearer …"`
# examples in markdown), so a history-wide gate would be red on day one and
# could never be turned green — which is how a check becomes theater. New
# leaks are blocked here; the existing backlog is tracked separately.
#
# WHY pull_request_target AND NOT pull_request
#
# Under `pull_request`, GitHub reads the workflow file AND the checked-out tree
# from the pull request's merge revision. A contributor could therefore edit
# this file, or edit .gitleaks.toml to allowlist their own payload, and the
# scan would report clean on exactly the change that needed scanning. The
# scanner would be enforcing a config supplied by the party being scanned.
#
# `pull_request_target` takes the workflow and the checked-out tree from the
# BASE branch, so both the scanner and its ruleset are trusted. The PR's
# commits are still what gets scanned: we fetch the head OBJECT and hand the
# base..head range to gitleaks. gitleaks only reads git objects — it never
# executes repository code — which is what makes this safe here. Nothing from
# the PR is checked out, built, or run.
#
# CONSEQUENCES, stated rather than discovered later:
#   - The ruleset applied to a PR is the base branch's. A PR that IMPROVES
#     .gitleaks.toml is not scanned by its own improvement; the new rules take
#     effect for PRs opened after it merges. That is the correct direction: it
#     is also what stops a PR from weakening the rules that judge it.
#   - Because the base branch must already carry this workflow for it to run,
#     this check does NOT run on the pull request that introduces it. It begins
#     running once this is on main. `gitleaks` is not in the repository's
#     required-status-check list, so that gap blocks nothing.
#   - permissions is contents:read even though pull_request_target can be
#     granted write. Least privilege, and nothing here needs to write.
#
# The binary is downloaded and pinned rather than using a marketplace action.
# This repo already carried two workflows that failed 46/46 runs because they
# depended on `chittysecrets/install-cli-action@v1`, which does not exist.
name: Secret Scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Base-branch tree: this gives us the TRUSTED .gitleaks.toml. On a push
      # to main the default ref is already the trusted revision.
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Fetch the PR's commits as OBJECTS ONLY. No checkout, no build, no
      # execution — the working tree stays on the trusted base revision.
      - name: Fetch pull request commits (objects only, never checked out)
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}/head"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          # sha256 of gitleaks_8.21.2_linux_x64.tar.gz, taken from the release's
          # own gitleaks_8.21.2_checksums.txt and independently confirmed by
          # downloading the asset and hashing it (2026-10-21). Pinning the
          # literal here rather than fetching checksums.txt at run time means a
          # swapped release asset fails the gate instead of being re-blessed by
          # a checksums file from the same compromised origin.
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks" 2>/dev/null \
            || { mkdir -p "$HOME/.local/bin" && install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"; }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Determine scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request_target" ]; then
            # The fetched remote-tracking ref, not an attacker-supplied sha
            # string interpolated into the command.
            PR_HEAD="$(git rev-parse "refs/remotes/pr/${PR_NUMBER}/head")"
            echo "log_opts=--no-merges $PR_BASE..$PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch with no prior ref — scan the tip commit only.
            echo "log_opts=--no-merges -1 $PUSH_AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=--no-merges $PUSH_BEFORE..$PUSH_AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan commits introduced by this change
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          # --redact so no secret value reaches the workflow log, which is
          # readable by anyone who can read the repo.
          # .gitleaks.toml here is the BASE branch's copy — see the header.
          gitleaks git \
            --no-banner \
            --redact \
            --config .gitleaks.toml \
            --log-opts "$LOG_OPTS" \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

# Runs gitleaks. Until this existed, .gitleaks.toml was referenced in exactly
# one place — a file-EXISTENCE check in governance-gates.yml — so the config
# had never scanned anything. A required-artifact check proves a file is
# present, not that it does anything.
#
# Scope is the PR's own commits, deliberately. A full-history scan of this repo
# currently reports 27 findings (mostly `curl -H "Authorization: Bearer …"`
# examples in markdown), so a history-wide gate would be red on day one and
# could never be turned green — which is how a check becomes theater. New
# leaks are blocked here; the existing backlog is tracked separately.
#
# The binary is downloaded and pinned rather than using a marketplace action.
# This repo already carried two workflows that failed 46/46 runs because they
# depended on `chittysecrets/install-cli-action@v1`, which does not exist.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            echo "log_opts=--no-merges $PR_BASE..$PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch with no prior ref — scan the tip commit only.
            echo "log_opts=--no-merges -1 $PUSH_AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=--no-merges $PUSH_BEFORE..$PUSH_AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan commits introduced by this change
        run: |
          set -euo pipefail
          # --redact so no secret value reaches the workflow log, which is
          # readable by anyone who can read the repo.
          gitleaks git \
            --no-banner \
            --redact \
            --config .gitleaks.toml \
            --log-opts "${{ steps.range.outputs.log_opts }}" \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

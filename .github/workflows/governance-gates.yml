name: Governance Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify governance artifacts
        run: |
          set -e
          missing=0
          for f in \
            CHARTER.md \
            CLAUDE.md \
            .gitleaks.toml \
            .github/secret-catalog.json \
            .github/allowed-workflow-secrets.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing governance artifact: $f"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

name: Temporary dependency lock repair

on:
  push:
    branches:
      - fix/context-synthetic-person-continuity

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-synthetic-person-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh patched transitive dependencies
        run: |
          npm audit fix --package-lock-only
          npm audit --audit-level=high
      - name: Commit repaired dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): refresh patched dependency graph"
          git push origin HEAD:fix/context-synthetic-person-continuity
